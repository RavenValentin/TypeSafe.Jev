version: 2
updates:
  # The library has one dependency on purpose, so this is mostly about the test and CI toolchain.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      test-toolchain:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk']
    ignore:
      # Pinned at the OLDEST version that works, deliberately: this is a floor, not a preference.
      # A library that demands a newer Microsoft.Extensions line drags every consumer onto it, including
      # the ones still on net8.0 — and raising the floor buys this package nothing, since NuGet already
      # resolves to whatever higher version the consuming app asks for. So: no bumps at all, any size.
      - dependency-name: Microsoft.Extensions.Logging.Abstractions

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
