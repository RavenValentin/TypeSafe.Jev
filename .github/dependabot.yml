version: 2
updates:
  # The library has one dependency on purpose, so this is mostly about the test and CI toolchain.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      test-toolchain:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk']
    ignore:
      # Pinned at the OLDEST version that works, deliberately: a library that demands a newer
      # Microsoft.Extensions line drags every consumer onto it, including the ones still on net8.0.
      # Patch updates are fine; major and minor ones are not, so Dependabot must not offer them.
      - dependency-name: Microsoft.Extensions.Logging.Abstractions
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
